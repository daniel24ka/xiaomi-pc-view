<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e9ee"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#3d6fd6"/>
      <stop offset="0.55" stop-color="#16244a"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
  </defs>
  <!-- background -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- wall mount -->
  <rect x="104" y="40" width="48" height="22" rx="8" fill="#ffffff" opacity="0.95"/>
  <rect x="120" y="58" width="16" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
  <!-- pan/tilt head -->
  <rect x="52" y="74" width="152" height="136" rx="44" fill="url(#body)"/>
  <!-- lens -->
  <circle cx="128" cy="138" r="46" fill="#1b1d24"/>
  <circle cx="128" cy="138" r="36" fill="url(#lens)"/>
  <circle cx="113" cy="123" r="10" fill="#ffffff" opacity="0.85"/>
  <circle cx="141" cy="152" r="4" fill="#ffffff" opacity="0.35"/>
  <!-- status light -->
  <circle cx="176" cy="96" r="6" fill="#ff5a00"/>
</svg>
